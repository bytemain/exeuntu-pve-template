name: Build PVE image

on:
  pull_request:
    paths:
      - Dockerfile
      - pve-*
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pve-*
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/bytemain/exeuntu-pve:${{ github.event.pull_request.head.sha || github.sha }}
            ghcr.io/bytemain/exeuntu-pve:main
          build-args: EXEUNTU_GIT_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


# Managed by exeuntu-pve-template. PVE injects keys at create time; first boot
# moves them from root to exedev before sshd is allowed to start.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AuthorizedKeysFile .ssh/authorized_keys
AllowUsers exedev
UsePAM yes

